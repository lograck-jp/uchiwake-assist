<h1>内訳アシスト（Excel アドイン）</h1>
<p class="ok">このページが表示されていれば、GitHub Pages の公開はできています。</p>
<p>保温工事の見積書「内訳」シートに、品目・施工箇所・仕様・サイズを選んで明細を登録するための Excel アドインです。</p>
<p>Excel からはホームタブの「内訳アシスト」ボタンで開きます。作業ウィンドウの本体は <code>taskpane.html</code> です。</p>
<p>単価や設定は、この公開ページには含まれません（利用者のパソコンの設定マスタから読み込みます）。</p>
